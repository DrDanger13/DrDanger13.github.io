<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joseph Dangerfield — Composer</title>
<meta name="description" content="Joseph Dangerfield — composer, pianist, and conductor. Concert works for piano, chamber ensemble, voice, and orchestra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15161b;
    --ink-soft:#20222a;
    --ivory:#f6f2e9;
    --ivory-dim:#ece5d4;
    --paper:#fbf9f4;
    --gold:#b8975a;
    --gold-soft:#d9c393;
    --line:#e3dcc9;
    --text-dim:#6b6a63;
    --max:1120px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-weight:400;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Archivo',sans-serif;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 32px;}
  img{max-width:100%;display:block;}

  /* ---------- NAV ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:26px 0;
    transition:background .4s ease, padding .4s ease, border-color .4s ease;
    border-bottom:1px solid transparent;
  }
  header.scrolled{
    background:rgba(251,249,244,0.92);
    backdrop-filter:blur(8px);
    padding:16px 0;
    border-color:var(--line);
  }
  header .wrap{display:flex;align-items:center;justify-content:space-between;}
  .brand{
    font-family:'Archivo',sans-serif;
    font-size:19px;
    letter-spacing:.04em;
    color:var(--ivory);
    transition:color .4s ease;
  }
  header.scrolled .brand{color:var(--ink);}
  nav ul{display:flex;gap:36px;list-style:none;}
  nav a{
    font-size:13px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ivory-dim);
    transition:color .3s ease;
    position:relative;
  }
  header.scrolled nav a{color:var(--ink);}
  nav a:hover{color:var(--gold);}
  .nav-toggle{display:none;}

  /* ---------- HERO ---------- */
  .hero{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(184,151,90,0.10), transparent 55%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-soft) 100%);
    color:var(--ivory);
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(246,242,233,0.035) 0 1px, transparent 1px 120px);
    pointer-events:none;
  }
  .hero .wrap{position:relative;width:100%;}
  .hero-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:64px;
    align-items:center;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold-soft);
  }
  .hero-quote p{
    font-family:'Archivo',sans-serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(22px,2.6vw,30px);
    line-height:1.5;
    color:var(--ivory);
    max-width:20ch;
  }
  .hero-quote cite{
    display:block;
    margin-top:22px;
    font-style:normal;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold-soft);
  }
  .hero-quote cite em{font-style:italic;}
  .hero-portrait{
    position:relative;
    justify-self:center;
    width:100%;
    max-width:340px;
  }
  .hero-portrait::before{
    content:"";
    position:absolute;
    top:-16px;left:-16px;right:16px;bottom:16px;
    border:1px solid var(--gold-soft);
    opacity:.5;
    z-index:0;
    border-radius:2px;
  }
  .hero-portrait img{
    position:relative;
    z-index:1;
    width:100%;
    height:auto;
    border-radius:2px;
    filter:grayscale(8%) contrast(1.04) saturate(0.95);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  /* ---------- SECTIONS (shared) ---------- */
  section{scroll-margin-top:100px;}
  .section-pad{padding:128px 0;}
  .section-head{margin-bottom:56px;}
  .section-head .eyebrow{color:var(--gold);margin-bottom:14px;}
  .section-head h2{
    font-size:clamp(30px,4vw,42px);
    font-weight:400;
    color:var(--ink);
    letter-spacing:-.01em;
  }

  /* ---------- ABOUT ---------- */
  .about{background:var(--paper);border-top:1px solid var(--line);}
  .about-grid{
    display:grid;
    grid-template-columns:1.35fr .65fr;
    gap:72px;
    align-items:start;
  }
  .about-lead{
    font-family:'Archivo',sans-serif;
    font-weight:400;
    font-style:italic;
    font-size:23px;
    line-height:1.55;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .about-body p{
    color:var(--text-dim);
    font-size:16px;
    line-height:1.85;
    margin-bottom:22px;
    max-width:60ch;
  }
  .about-body p:last-child{margin-bottom:0;}
  .facts{display:flex;flex-direction:column;gap:36px;}
  .fact-group h3{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .fact-group ul{list-style:none;}
  .fact-group li{
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .fact-group li:last-child{border-bottom:none;}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:860px){
    nav{position:fixed;inset:0;top:0;background:var(--ink);flex-direction:column;padding:110px 32px 40px;transform:translateY(-100%);transition:transform .4s ease;z-index:90;}
    nav.open{transform:translateY(0);}
    nav ul{flex-direction:column;gap:26px;}
    nav a{color:var(--ivory);font-size:16px;}
    .nav-toggle{
      display:flex;flex-direction:column;gap:5px;
      width:26px;z-index:110;cursor:pointer;background:none;border:none;
    }
    .nav-toggle span{height:1px;background:var(--ivory);transition:background .3s;}
    header.scrolled .nav-toggle span{background:var(--ink);}
    .hero-grid{grid-template-columns:1fr;gap:44px;}
    .hero-portrait{order:-1;max-width:220px;margin:0 auto;}
    .about-grid{grid-template-columns:1fr;gap:48px;}
    .section-pad{padding:88px 0;}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="wrap">
    <a href="#" class="brand">Joseph Dangerfield</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="siteNav">
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="current-work.html">Current Work</a></li>
        <li><a href="works.html">Works</a></li>
        <li><a href="listen.html">Listen</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hero-grid">
      <div>
        <div class="eyebrow">Composer · Pianist · Conductor</div>
      </div>
      <figure class="hero-portrait">
        <img src="assets/headshot.jpg" alt="Portrait of composer Joseph Dangerfield">
      </figure>
    </div>
  </div>
</section>

<script>
  const header = document.getElementById('siteHeader');
  const toggle = document.getElementById('navToggle');
  const nav = document.getElementById('siteNav');

  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 40);
  });

  toggle.addEventListener('click', () => {
    nav.classList.toggle('open');
  });

  nav.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => nav.classList.remove('open'));
  });
</script>

</body>
</html>
